name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-randomly
      - run: pytest tests/ --junit-xml=results.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results.xml